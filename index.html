  <div id="user-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-charcoal-900/60 backdrop-blur-sm"></div>
    <div class="relative z-10 max-w-xl mx-auto mt-20 bg-retro-card rounded-3xl border border-retro-border shadow-2xl p-6 animate-modal-fade">
      <div class="flex items-center justify-between mb-6">
        <div>
          <p class="text-[11px] uppercase tracking-[0.22em] text-pastel-orange-dark font-black">Minha conta</p>
          <h3 class="text-2xl font-display font-black text-charcoal-800">Dados de entrega</h3>
        </div>
        <button type="button" onclick="fecharModalUsuario()" class="w-10 h-10 rounded-full bg-retro-subtle border border-retro-border text-charcoal-800 hover:text-pastel-orange-dark">✕</button>
      </div>

      <form id="user-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-charcoal-500 mb-1">Nome</label>
          <input name="name" type="text" class="w-full rounded-2xl border border-retro-border bg-retro-subtle px-4 py-3 text-sm text-charcoal-800 focus:outline-none focus:border-pastel-orange" placeholder="Seu nome" required />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-charcoal-500 mb-1">E-mail</label>
          <input name="email" type="email" class="w-full rounded-2xl border border-retro-border bg-retro-subtle px-4 py-3 text-sm text-charcoal-800 focus:outline-none focus:border-pastel-orange" placeholder="seu@email.com" required />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-charcoal-500 mb-1">Telefone</label>
          <input name="phone" type="tel" class="w-full rounded-2xl border border-retro-border bg-retro-subtle px-4 py-3 text-sm text-charcoal-800 focus:outline-none focus:border-pastel-orange" placeholder="(31) 99999-0000" required />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-charcoal-500 mb-1">Endereço</label>
          <textarea name="address" rows="3" class="w-full rounded-2xl border border-retro-border bg-retro-subtle px-4 py-3 text-sm text-charcoal-800 focus:outline-none focus:border-pastel-orange" placeholder="Rua, número, bairro, complemento" required></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="fecharModalUsuario()" class="px-5 py-3 rounded-full border border-retro-border bg-retro-subtle text-charcoal font-bold text-xs uppercase tracking-wider">Cancelar</button>
          <button type="submit" class="px-5 py-3 rounded-full bg-pastel-blue text-white font-extrabold text-xs uppercase tracking-wider">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="cart-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-charcoal-900/60 backdrop-blur-sm"></div>
    <div class="relative z-10 max-w-xl mx-auto mt-20 bg-retro-card rounded-3xl border border-retro-border shadow-2xl p-6 animate-modal-fade">
      <div class="flex items-center justify-between mb-6">
        <div>
          <p class="text-[11px] uppercase tracking-[0.22em] text-pastel-blue-dark font-black">Carrinho</p>
          <h3 class="text-2xl font-display font-black text-charcoal-800">Seu pedido</h3>
        </div>
        <button type="button" onclick="fecharCarrinho()" class="w-10 h-10 rounded-full bg-retro-subtle border border-retro-border text-charcoal-800 hover:text-pastel-orange-dark">✕</button>
      </div>

      <div id="cart-items" class="space-y-3 max-h-[420px] overflow-y-auto pr-1"></div>

      <div class="mt-6 border-t border-retro-border pt-4 flex items-center justify-between">
        <span class="text-xs uppercase tracking-wider font-bold text-charcoal-500">Total</span>
        <span id="cart-total" class="text-2xl font-black font-display text-charcoal-800">R$ 0,00</span>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button type="button" onclick="fecharCarrinho()" class="px-5 py-3 rounded-full border border-retro-border bg-retro-subtle text-charcoal font-bold text-xs uppercase tracking-wider">Continuar</button>
        <button id="cart-finalize-button" type="button" class="px-5 py-3 rounded-full bg-pastel-orange text-white font-extrabold text-xs uppercase tracking-wider">Finalizar pedido</button>
      </div>
    </div>
  </div>

  <script defer src="script.js"></script>
</body>
</html>
